<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            margin-bottom: 30px;
            text-align: center;
            color: #6b7280;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .submit-button {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: #166534;
            background: #dcfce7;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .container {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .submit-button {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Student Performance Predictor</h1>
        <p class="subtitle">
            Enter the student details to predict the mathematics score.
        </p>

        <form action="{{ url_for('predict') }}" method="post">            <div class="form-grid">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="race_ethnicity">Race/Ethnicity</label>
                    <select id="race_ethnicity" name="race_ethnicity" required>
                        <option value="">Select group</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="parental_level_of_education">
                        Parental Level of Education
                    </label>
                    <select id="parental_level_of_education"
                            name="parental_level_of_education" required>
                        <option value="">Select education level</option>
                        <option value="some high school">Some High School</option>
                        <option value="high school">High School</option>
                        <option value="some college">Some College</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="master's degree">Master's Degree</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lunch">Lunch</label>
                    <select id="lunch" name="lunch" required>
                        <option value="">Select lunch type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="test_preparation_course">
                        Test Preparation Course
                    </label>
                    <select id="test_preparation_course"
                            name="test_preparation_course" required>
                        <option value="">Select course status</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reading_score">Reading Score</label>
                    <input type="number" id="reading_score" name="reading_score"
                           min="0" max="100" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="writing_score">Writing Score</label>
                    <input type="number" id="writing_score" name="writing_score"
                           min="0" max="100" step="0.01" required>
                </div>

                <button class="submit-button" type="submit">
                    Predict Mathematics Score
                </button>
            </div>
        </form>

        {% if results %}
            <div class="result">
                Predicted Mathematics Score: {{ results }}
            </div>
        {% endif %}
    </main>
</body>
</html>
